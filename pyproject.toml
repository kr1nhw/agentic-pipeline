[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docpipe"
version = "0.1.0"
description = "Agentic, VL-planned pipeline for extracting content from documents"
readme = "README.md"
requires-python = ">=3.12"

# Runtime dependencies. Kept deliberately small: everything here must have a
# manylinux wheel that works on the containerd/docker build host (glibc >= 2.28)
# and inside the image (Debian bookworm, glibc 2.36).
dependencies = [
    "pypdfium2>=4.30,<5",      # PDF render + text, bundles pdfium (no poppler required)
    "pdfplumber>=0.11,<0.12",  # layout, words, rects, table strategies
    "python-pptx>=1.0,<2",     # PPTX shapes, text, tables, media
    "python-docx>=1.1,<2",     # DOCX paragraphs, styles, tables
    "Pillow>=10.4,<12",        # image probing and thumbnails
    "pyarrow>=17,<22",         # parquet writers (streaming, bounded memory)
    "pandas>=2.2,<3",          # convenience frames for small aggregates
    "httpx>=0.27,<0.29",       # DeepSeek API client (sync + retries)
    "pydantic>=2.8,<3",        # schema validation for plans and records
    "pydantic-settings>=2.4,<3",
    "PyYAML>=6,<7",            # pipeline catalog
    "rich>=13,<15",            # CLI/report rendering
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3"]
# Optional, and absent from the default image on purpose: the Daft execution
# engine is declared but not implemented — the local executor is what runs. A
# hard dependency on a 56 MB wheel for a capability no code path uses would be a
# lie in the dependency list, and it stalled every build on this host.
daft = ["daft>=0.4,<0.8"]

[project.scripts]
docpipe = "docpipe.cli:main"

[tool.setuptools.packages.find]
include = ["docpipe*"]

# The pipeline catalog ships with the code: a static pipeline that cannot be
# loaded is a wrong default, and the image must be self-contained.
[tool.setuptools.package-data]
docpipe = ["pipelines/*.yml", "pipelines/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 300
